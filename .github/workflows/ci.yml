name: CI

on:
  push:
    branches: [main, OmniCommander_MCP]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: npx vitest run --config server/vitest.config.ts

      - name: Typecheck
        run: npx tsc --build shared/tsconfig.json server/tsconfig.json

      - name: Build web
        run: npx vite build
        working-directory: web

      - name: MCP smoke test (tools/list)
        run: |
          mkdir -p data
          npx @modelcontextprotocol/inspector --cli node server/dist/mcp-entry.js --method tools/list
        env:
          DB_PATH: ./data/ci-smoke.db
