<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Connection lines -->
  <line x1="32" y1="16" x2="18" y2="32" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="16" x2="46" y2="32" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="18" y1="32" x2="24" y2="48" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="46" y1="32" x2="40" y2="48" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="24" y1="48" x2="40" y2="48" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Center node (commander) -->
  <circle cx="32" cy="16" r="6" fill="url(#accent)"/>
  <circle cx="32" cy="16" r="3" fill="#0f172a"/>
  <circle cx="32" cy="16" r="1.5" fill="url(#accent)"/>
  <!-- Agent nodes -->
  <circle cx="18" cy="32" r="4.5" fill="url(#accent)" opacity="0.85"/>
  <circle cx="18" cy="32" r="2" fill="#0f172a"/>
  <circle cx="46" cy="32" r="4.5" fill="url(#accent)" opacity="0.85"/>
  <circle cx="46" cy="32" r="2" fill="#0f172a"/>
  <circle cx="24" cy="48" r="4" fill="url(#accent)" opacity="0.7"/>
  <circle cx="24" cy="48" r="1.5" fill="#0f172a"/>
  <circle cx="40" cy="48" r="4" fill="url(#accent)" opacity="0.7"/>
  <circle cx="40" cy="48" r="1.5" fill="#0f172a"/>
</svg>
